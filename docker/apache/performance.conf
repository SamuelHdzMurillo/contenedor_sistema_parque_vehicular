<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          1
    MaxSpareServers          4
    MaxRequestWorkers       20
    MaxConnectionsPerChild 1000
</IfModule>

KeepAlive On
KeepAliveTimeout 2
MaxKeepAliveRequests 80
Timeout 60
HostnameLookups Off
ServerTokens Prod
ServerSignature Off
